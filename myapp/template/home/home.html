
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile {
            width: 360px;
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .profile img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .profile h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .profile .role {
            color: #777;
            margin-bottom: 20px;
        }

        .profile p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .socials a {
            text-decoration: none;
            color: #222;
            border: 1px solid #ddd;
            padding: 8px 14px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .socials a:hover {
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <div class="profile">

        <img src="https://i.pravatar.cc/150" alt="Profile">

        <h1>Your Name</h1>

        <div class="role">
            Full Stack Developer
        </div>

        <p>
            Hello! I'm a developer who enjoys building
            simple and useful web applications.
        </p>

        <div class="socials">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
            <a href="#">Email</a>
        </div>

    </div>

</body>
</html>
